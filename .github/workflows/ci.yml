name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: coffeecup — lint, type-check, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coffeecup
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: coffeecup/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test (Vitest, in-process Postgres, mock model provider)
        run: npm test

      - name: Build
        run: npm run build
